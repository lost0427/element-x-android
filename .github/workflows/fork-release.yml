name: Publish fork APK release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'lost0427/element-x-android'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          large-packages: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Restore signing key
        env:
          FORK_KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FORK_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$FORK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fork-release.p12"

      - name: Build signed APKs
        env:
          FORK_KEYSTORE_FILE: ${{ runner.temp }}/fork-release.p12
          FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          FORK_KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
          FORK_KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
          FORK_VERSION_NAME: ${{ github.ref_name }}
          FORK_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export FORK_VERSION_CODE=$((10000000 + FORK_VERSION_CODE))
          ./gradlew :app:assembleFdroidRelease -PforkRelease=true \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            --max-workers=2 --no-parallel --no-configuration-cache --no-daemon --stacktrace

      - name: Verify signatures and prepare downloads
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          apks=(app/build/outputs/apk/fdroid/release/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
            filename=$(basename "$apk")
            cp "$apk" "release/element-x-${GITHUB_REF_NAME}-${filename#app-fdroid-}"
          done
          (cd release && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-apks-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Fork build with Chinese message search and multiple account profiles.

          Install the universal APK, or the arm64-v8a APK for most modern phones.
          Package: io.element.android.x.lost0427. Signed with a persistent fork key.
          The FDroid flavour supports UnifiedPush and does not include Google Firebase push.

          This is a prerelease using a nightly Matrix SDK. Chinese search scans the local index;
          large histories still need performance and memory validation.
          NOTES
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --title "Element X Fork $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/fork-release.p12"
